    <script>
        // Variabel global untuk menyimpan audio yang sedang berputar
        let currentAudio = null;

        function playMeme(url) {
            // Jika ada suara yang sedang berputar, hentikan segera
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            // Putar suara yang baru dipilih
            currentAudio = new Audio(url);
            currentAudio.play();
        }
    </script>
